<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found - Surfmate</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #000;
        color: #fff;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      a {
        color: #73c9eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>If you followed a creator invite, we are redirecting you now.</p>
      <p><a href="/">Back to Surfmate</a></p>
    </main>
    <script>
      (function () {
        var pathname = window.location.pathname || "";
        if (!pathname.startsWith("/c/")) return;

        var segments = pathname.split("/").filter(Boolean);
        var slug = segments[1] || "";
        var target = "/c/?slug=" + encodeURIComponent(slug);
        if (window.location.search) {
          target += "&" + window.location.search.slice(1);
        }
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
