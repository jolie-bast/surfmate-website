<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found - Surfmate</title>
    <script>
      (function () {
        var pathname = window.location.pathname || "";
        var prefix = pathname.startsWith("/c/")
          ? "/c/"
          : pathname.startsWith("/p/")
            ? "/p/"
            : pathname.startsWith("/g/")
              ? "/g/"
              : "";
        if (!prefix) return;

        var segments = pathname.split("/").filter(Boolean);
        var slug = segments[1] || "";
        if (!slug || slug === "index.html") return;

        document.documentElement.className = "is-campaign-redirect";

        var target = prefix + "?slug=" + encodeURIComponent(slug);
        if (window.location.search) {
          target += "&" + window.location.search.slice(1);
        }
        window.location.replace(target);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html.is-campaign-redirect,
      html.is-campaign-redirect body {
        background: #000;
      }

      html.is-campaign-redirect body > * {
        display: none;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #000;
        color: #fff;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      a {
        color: #73c9eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>If you followed a Surfmate invite or campaign link, we are redirecting you now.</p>
      <p><a href="/">Back to Surfmate</a></p>
    </main>
  </body>
</html>
