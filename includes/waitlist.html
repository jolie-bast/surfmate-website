<!-- Newsletter Section -->
<section id="newsletter" class="waitlist">
  <div class="container">
    <div class="waitlist-content">
      <h2 class="waitlist-title">Newsletter</h2>
      <p class="waitlist-description">
        Stay in the loop — surf stories, updates, and what&apos;s new at Surfmate.
      </p>

      <div class="waitlist-form">
        <form id="waitlist-form" class="custom-waitlist-form" method="post" action="#newsletter" novalidate>
          <div class="form-row">
            <input
              type="email"
              id="waitlist-email"
              name="email"
              placeholder="Your Email Address"
              autocomplete="email"
              inputmode="email"
              required
              aria-describedby="error-message"
            />
            <button type="submit" id="waitlist-submit">Subscribe</button>
          </div>
          <p id="error-message" class="error-message" role="alert" hidden></p>
        </form>

        <div id="success-message" class="success-message" role="status" hidden>
          <p><strong>You&apos;re subscribed!</strong></p>
          <p>Thanks for joining the Surfmate newsletter. We&apos;ll keep you posted.</p>
        </div>
      </div>
    </div>
  </div>
</section>
