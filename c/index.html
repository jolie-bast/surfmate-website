<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/css/consent.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-DKK7DGE8ED"
    ></script>
    <script src="/js/gtag-init.js"></script>
    <script src="/js/consent.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Join Surfmate through a creator invite and download the app."
    />
    <title>Creator Invite - Surfmate</title>

    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/creator-referral.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  </head>
  <body class="creator-referral-page">
    <div data-include="header.html"></div>

    <main class="creator-referral-main">
      <section class="creator-referral-hero" aria-labelledby="creator-referral-title">
        <div class="creator-referral-inner">
          <p class="creator-referral-kicker">Creator Invite</p>
          <h1 id="creator-referral-title" class="creator-referral-title">
            Loading your Surfmate invite...
          </h1>
          <p id="creator-referral-copy" class="creator-referral-copy">
            Checking the creator link and preparing the best next step for your device.
          </p>

          <div id="creator-referral-cta" class="creator-referral-cta" hidden>
            <a
              id="creator-referral-primary"
              class="creator-referral-button"
              href="/"
            >
              Continue
            </a>
          </div>

          <div id="creator-referral-badges" class="creator-referral-badges" hidden>
            <a
              href="https://apps.apple.com/de/app/surfmate-surf-log-connect/id6760191082"
              class="creator-referral-store-badge"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="/assets/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                alt="Download on the App Store"
                width="120"
                height="40"
              />
            </a>
            <a
              href="https://play.google.com/store/apps/details?id=com.joliebast.surfmateapp&pcampaignid=web_share"
              class="creator-referral-store-badge"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="/assets/GetItOnGooglePlay_Badge_Web_color_English.svg"
                alt="Get it on Google Play"
                width="135"
                height="40"
              />
            </a>
          </div>

          <p id="creator-referral-note" class="creator-referral-note">
            If Surfmate is already installed, your phone may open the app directly instead.
          </p>
        </div>
      </section>
    </main>

    <div data-include="footer.html"></div>

    <script src="/js/supabase-config.js"></script>
    <script src="/js/includes.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/creator-referral.js" defer></script>
  </body>
</html>
