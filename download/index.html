<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Download Surfmate</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script>
      (function () {
        var SKIP_KEY = "surfmate_skip_store_redirect";

        var ua = navigator.userAgent || "";
        if (
          /Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|TikTok|musical_ly|BytedanceWebview|TTWebView|Snapchat|aweme/i.test(
            ua
          )
        ) {
          return;
        }

        try {
          if (sessionStorage.getItem(SKIP_KEY) === "1") return;
        } catch (error) {}

        var APP_STORE_URL =
          "https://apps.apple.com/de/app/surfmate-surf-log-connect/id6760191082";
        var PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.joliebast.surfmateapp&pcampaignid=web_share";

        var platform = navigator.platform || "";
        var maxTouchPoints = navigator.maxTouchPoints || 0;
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (platform === "MacIntel" && maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        if (!isIOS && !isAndroid) return;

        try {
          sessionStorage.setItem(SKIP_KEY, "1");
        } catch (error) {}

        window.location.href = isIOS ? APP_STORE_URL : PLAY_STORE_URL;
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #03141d;
        color: #fff;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .download-stores {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .download-stores a {
        display: inline-block;
      }

      .download-stores img {
        display: block;
        height: 44px;
        width: auto;
      }

      .download-home {
        display: inline-block;
        margin-top: 1.5rem;
        color: #73c9eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Download Surfmate</h1>
      <p id="download-copy">
        Choose your app store below, or open this link on your phone for a direct redirect.
      </p>
      <div class="download-stores">
        <a
          href="https://apps.apple.com/de/app/surfmate-surf-log-connect/id6760191082"
          rel="noopener noreferrer"
        >
          <img
            src="/assets/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
            alt="Download on the App Store"
            width="120"
            height="40"
          />
        </a>
        <a
          href="https://play.google.com/store/apps/details?id=com.joliebast.surfmateapp&pcampaignid=web_share"
          rel="noopener noreferrer"
        >
          <img
            src="/assets/GetItOnGooglePlay_Badge_Web_color_English.svg"
            alt="Get it on Google Play"
            width="135"
            height="40"
          />
        </a>
      </div>
      <a class="download-home" href="/">Visit surfmate.eu</a>
    </main>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var platform = navigator.platform || "";
        var maxTouchPoints = navigator.maxTouchPoints || 0;
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (platform === "MacIntel" && maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);
        var copy = document.getElementById("download-copy");

        if (!copy || (!isIOS && !isAndroid)) return;

        copy.textContent = isIOS
          ? "Opening the App Store…"
          : "Opening Google Play…";
      })();
    </script>
  </body>
</html>
