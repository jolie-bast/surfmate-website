    <script>
      (function () {
        var SKIP_KEY = "surfmate_skip_store_redirect";
        var params = new URLSearchParams(window.location.search);
        if (params.has("web")) return;

        var ua = navigator.userAgent || "";
        if (
          /Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|TikTok|musical_ly|BytedanceWebview|TTWebView|Snapchat|aweme/i.test(
            ua
          )
        ) {
          return;
        }

        try {
          if (sessionStorage.getItem(SKIP_KEY) === "1") return;
        } catch (error) {}

        try {
          if (document.referrer) {
            var referrerHost = new URL(document.referrer).hostname;
            if (referrerHost === window.location.hostname) return;
          }
        } catch (error) {}

        var APP_STORE_URL =
          "https://apps.apple.com/de/app/surfmate-surf-log-connect/id6760191082";
        var PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.joliebast.surfmateapp&pcampaignid=web_share";
        var platform = navigator.platform || "";
        var maxTouchPoints = navigator.maxTouchPoints || 0;
        var isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (platform === "MacIntel" && maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        if (!isIOS && !isAndroid) return;

        try {
          sessionStorage.setItem(SKIP_KEY, "1");
        } catch (error) {}

        window.location.href = isIOS ? APP_STORE_URL : PLAY_STORE_URL;
      })();
    </script>

      <script type="application/ld+json" id="surfmate-faq">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "https://surfmate.eu/#faq",
  "url": "https://surfmate.eu/#faq",
  "isPartOf": {
    "@id": "https://surfmate.eu/#website"
  },
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What can I log for a session?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Surfmate helps you capture every surf that matters. You can log:\n\n- Surf spot, date and time\n- Session duration and overall rating\n- Up to 3 photos and your notes\n- Surf conditions, emotions and vibes\n- Session highlights"
      }
    },
    {
      "@type": "Question",
      "name": "Who can see my sessions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You decide. Sessions can stay completely private or be visible to your friends."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if I log a session at a secret spot?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nothing gets exposed. Sessions at secret spots are currently always private, even for your followers. Your spots stay yours."
      }
    },
    {
      "@type": "Question",
      "name": "Why should I log my sessions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Surfmate helps you remember:\n\n- where you surfed\n- how the conditions were\n- how the session felt\n- who you surfed with\n- how your surf journey evolves over time\n\n It is your personal surf history."
      }
    },
    {
      "@type": "Question",
      "name": "Can I connect forecasts directly to my sessions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Forecast integrations are planned for future versions."
      }
    },
    {
      "@type": "Question",
      "name": "What is a Spotcheck?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A Spotcheck is a quick photo or up to 20-second video from a surf spot that stays visible for 24 hours.\n\n It lets your friends instantly see what the ocean looks like right now, without sharing the same videos across group chats."
      }
    },
    {
      "@type": "Question",
      "name": "Who can see my Spotchecks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Everyone who follows you can see your Spotchecks. They can also enable push notifications to get alerted when you post one."
      }
    },
    {
      "@type": "Question",
      "name": "How long are Spotchecks visible?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Spotchecks stay visible for 24 hours. Your own past Spotchecks remain saved in your personal archive."
      }
    },
    {
      "@type": "Question",
      "name": "Why use Spotchecks instead of WhatsApp?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Surf conditions change fast. Instead of sending the same update to multiple chats, post one Spotcheck and everyone instantly knows what is going on.\n\n Cleaner, faster, and built for surfing."
      }
    },
    {
      "@type": "Question",
      "name": "Can I post Spotchecks at secret spots?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. If a Spotcheck is posted at a secret spot, only people who know that spot can see it."
      }
    },
    {
      "@type": "Question",
      "name": "Can I get notifications for Spotchecks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can enable push notifications for the surfers you follow and instantly know when they check the waves."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to add every spot myself?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Surfmate already includes more than 4,000 surf spots, and we are continuously adding more."
      }
    },
    {
      "@type": "Question",
      "name": "What if my spot is missing?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can create your own secret spot that only you can see, unless you decide to share it."
      }
    },
    {
      "@type": "Question",
      "name": "Are secret spots really private?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Secret spots are completely private unless you actively share them with someone.\n\n Surfmate is built to help surfers organize their personal surf world, not expose it."
      }
    },
    {
      "@type": "Question",
      "name": "What information can I save for a spot?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can save:\n\n- Preferred tide\n- Break type (beach, reef, point)\n- Wave type (left, right, hollow, mushy, fast, longboard)\n- Notes, photos and videos\n- Webcam links and forecast links\n\n So every spot becomes your personal surf guide over time."
      }
    },
    {
      "@type": "Question",
      "name": "Can I share spots with friends?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can send spots directly to friends and choose exactly which information you want to share."
      }
    },
    {
      "@type": "Question",
      "name": "Can I share secret spots?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Once shared, both of you can use Spotchecks there privately. Only surfers who know the spot can see activity around it."
      }
    },
    {
      "@type": "Question",
      "name": "Can I see which friends surfed a spot?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can see which friends surfed there and when they last visited."
      }
    },
    {
      "@type": "Question",
      "name": "Why follow other surfers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Following keeps you connected to your surf crew. You see their Spotchecks and know when conditions are good, where people are surfing, and when friends are checking the waves."
      }
    },
    {
      "@type": "Question",
      "name": "How can I follow people?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can:\n\n- Scan their Surfmate QR code\n- Share profile links\n- Search by username\n- Search in your contacts friends and invite them\n\n Invite your surf crew and stay connected on and off the water."
      }
    },
    {
      "@type": "Question",
      "name": "Can I see my friends' sessions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Currently, you can see the latest public sessions on their profiles."
      }
    },
    {
      "@type": "Question",
      "name": "Can I see someone's secret spots if I follow them?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Secret spots are never visible unless someone explicitly shares them with you."
      }
    },
    {
      "@type": "Question",
      "name": "Whose sessions do I see?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sessions from your mates (surfers you follow) and from all surfers within 500 km of you who logged their sessions publicly."
      }
    },
    {
      "@type": "Question",
      "name": "Are there ads?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Surfmate has no ads and no doomscrolling — just real surf sessions from people in your community."
      }
    },
    {
      "@type": "Question",
      "name": "Is my profile public?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You decide. Your profile can be public or private — switch anytime in your profile settings."
      }
    },
    {
      "@type": "Question",
      "name": "Can I have a private profile?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. With a private profile, only people you allow can view it. Your profile stays out of public discovery until you choose to open it up."
      }
    },
    {
      "@type": "Question",
      "name": "What are Surfmate Points?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Surfmate Points track your activity inside the app. You earn them by:\n\n- logging sessions\n- posting Spotchecks\n- staying active"
      }
    },
    {
      "@type": "Question",
      "name": "What do Surfmate Points unlock?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You will see. It will be worth collecting them."
      }
    },
    {
      "@type": "Question",
      "name": "My explored countries count is wrong. What can I do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Log at least one session from every country you have surfed in. Older sessions count too, and you can also log sessions using only the year if you do not remember the exact date."
      }
    },
    {
      "@type": "Question",
      "name": "Who can see my Journal?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nobody. Your Journal is completely private. It is your personal place to relive your surf journey, memories, progression, and favorite sessions over time."
      }
    },
    {
      "@type": "Question",
      "name": "Can I filter or sort my Journal?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "More advanced Journal views and filters are already in development. The goal is to make looking back on your surf life even more immersive and personal."
      }
    },
    {
      "@type": "Question",
      "name": "What is coming next for Surfmate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We are just getting started. Planned features include:\n\n- Open To Connect Mode\n- Close Friends sharing\n- More advanced Journal views\n- Better session insights and stats\n- Forecast integrations\n\n Surfmate is evolving into the community platform for your entire surf journey.\n\n Your surf. Your story."
      }
    }
  ]
}
