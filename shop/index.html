<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/css/consent.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-DKK7DGE8ED"
    ></script>
    <script src="/js/gtag-init.js"></script>
    <script src="/js/consent.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Surfmate Wear Drop 01 — Nov 15. Made in Portugal, hand-printed on Mallorca. Online for two weeks only. Join the list for early access."
    />
    <title>Surfmate Wear – Drop 01 · Nov 15</title>
    <link rel="canonical" href="https://surfmate.eu/shop/" />

    <meta property="og:title" content="Surfmate Wear – Drop 01 · Nov 15" />
    <meta
      property="og:description"
      content="Your Surf. Your Story. Two weeks online, small numbers. Join the list for early access."
    />
    <meta property="og:image" content="https://surfmate.eu/assets/wear/teaser-hoodie-1400.jpg" />
    <meta property="og:url" content="https://surfmate.eu/shop/" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/shop-teaser.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/assets/wear/teaser-hoodie-800.webp 800w, /assets/wear/teaser-hoodie-1400.webp 1400w"
      imagesizes="100vw"
    />
  </head>
  <body class="wear-teaser-page">
    <div data-include="header.html"></div>

    <main class="wt">
      <picture class="wt-bg">
        <source
          type="image/webp"
          srcset="/assets/wear/teaser-hoodie-800.webp 800w, /assets/wear/teaser-hoodie-1400.webp 1400w"
          sizes="100vw"
        />
        <img
          src="/assets/wear/teaser-hoodie-1400.jpg"
          srcset="/assets/wear/teaser-hoodie-800.jpg 800w, /assets/wear/teaser-hoodie-1400.jpg 1400w"
          sizes="100vw"
          width="1400"
          height="2100"
          alt="Two surfers at the beach at sunset, one wearing the black Surfmate hoodie with the back print Your Surf. Your Story."
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <div class="wt-shade" aria-hidden="true"></div>

      <div class="wt-inner">
        <p class="wt-kicker">The brand behind the community</p>
        <h1 class="wt-title">Your Surf.<br />Your Story.</h1>

        <div class="wt-bar">
          <div class="wt-countdown-wrap" data-countdown="2026-11-15T19:00:00Z">
            <p class="wt-label" id="wt-countdown-label">Shop opens in</p>
            <div class="wt-countdown" role="timer" aria-labelledby="wt-countdown-label">
              <span class="wt-num" data-unit="days">–</span><span class="wt-u">d</span>
              <span class="wt-num" data-unit="hours">–</span><span class="wt-u">h</span>
              <span class="wt-num" data-unit="mins">–</span><span class="wt-u">m</span>
            </div>
          </div>

          <div class="wt-signup">
            <form class="wt-form" id="wt-form" novalidate>
              <label for="wt-email" class="wt-sr-only">Email</label>
              <input id="wt-email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required />
              <button type="submit" id="wt-submit">Get early access</button>
            </form>
            <p class="wt-error" id="wt-error" role="alert" hidden></p>
            <p class="wt-success" id="wt-success" role="status" hidden>
              You're on the list. We'll email you the early-access link on Nov 15.
            </p>
            <p class="wt-note">
              Join the list and shop one hour before everyone else — Nov 15,
              7 pm Lisbon · 8 pm Berlin. Two weeks only.
              <a href="/datenschutz.html">Privacy</a> ·
              <a href="https://www.instagram.com/surfmate.wear/" target="_blank" rel="noopener noreferrer">@surfmate.wear</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <div data-include="footer.html"></div>

    <script src="/js/includes.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/wear-teaser.js" defer></script>
  </body>
</html>
